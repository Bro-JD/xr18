name: xr18_control
description: A Flutter app to control the master fader of the Behringer XR18 mixer via UDP.


environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  udp: ^5.0.3 # For sending UDP packets
  flutter_launcher_icons: "^0.9.2"

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/ # Uncomment this section if you have assets like images or audio files

flutter_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"

# You can also add additional packages here if needed
